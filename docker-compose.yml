services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pivo_sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Simple_Pass123
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - pivo_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Simple_Pass123' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      
volumes:
  pivo_data: